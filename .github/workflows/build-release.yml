name: Build and Release MYRAA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --include=dev

      - name: Package with Electron Builder (NSIS & Portable)
        shell: pwsh
        run: |
          if (Test-Path "build") { } else { New-Item -ItemType Directory -Path "build" -Force }
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" -Destination "build/icon.ico" -Force }
          if (Test-Path "icon.png") { Copy-Item "icon.png" -Destination "build/icon.png" -Force }
          npx --yes electron-builder --win --x64 --config.directories.output=release_dist

      - name: Package Universal Standalone ZIP
        shell: pwsh
        run: |
          if (Test-Path "release_dist\win-unpacked") {
            Write-Host "Creating Universal Standalone Portable ZIP from win-unpacked..."
            Compress-Archive -Path release_dist\win-unpacked\* -DestinationPath release_dist\MYRAA-v1.0.0-Windows-Universal-Portable.zip -CompressionLevel Optimal -Force
          } else {
            Write-Host "Creating Universal Standalone Portable ZIP from repository root..."
            if (-not (Test-Path "release_dist")) { New-Item -ItemType Directory -Path "release_dist" -Force }
            Compress-Archive -Path dist, electron, assets, START_SERVER.bat, package.json, memories.json, icon.ico, icon.png, README.md, LICENSE -DestinationPath release_dist\MYRAA-v1.0.0-Windows-Universal-Portable.zip -CompressionLevel Optimal -Force
          }

      - name: Standardize Windows Output Filenames
        shell: pwsh
        run: |
          Get-ChildItem release_dist
          $setup = Get-ChildItem release_dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($setup -and ($setup.Name -ne "MYRAA-Setup-1.0.0.exe")) {
            Copy-Item $setup.FullName -Destination "release_dist/MYRAA-Setup-1.0.0.exe" -Force
          }
          $portable = Get-ChildItem release_dist -Filter "*Portable*.exe" | Select-Object -First 1
          if ($portable -and ($portable.Name -ne "MYRAA-Portable-1.0.0.exe")) {
            Copy-Item $portable.FullName -Destination "release_dist/MYRAA-Portable-1.0.0.exe" -Force
          }

      - name: Generate Windows SHA256 Checksums
        shell: pwsh
        run: |
          Get-FileHash release_dist\MYRAA-* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -FilePath release_dist\SHA256SUMS-windows.txt -Encoding ascii
          Get-Content release_dist\SHA256SUMS-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release_dist/MYRAA-Setup-*.exe
            release_dist/MYRAA-Portable-*.exe
            release_dist/MYRAA-*-Windows-Universal-Portable.zip
            release_dist/SHA256SUMS-windows.txt
          if-no-files-found: warn

  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true
          if [ -f icon.png ]; then cp icon.png android/app/src/main/assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico android/app/src/main/assets/favicon.ico; fi

      - name: Compile Standalone Android APK
        run: |
          mkdir -p android_dist
          echo "Compiling standalone APK via Android SDK build-tools..."
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          PLATFORM_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Using Build Tools: $BUILD_TOOLS_DIR, Platform: $PLATFORM_JAR"
          
          mkdir -p apk_scratch/compiled_res apk_scratch/gen apk_scratch/classes apk_scratch/dex
          $BUILD_TOOLS_DIR/aapt2 compile --dir android/app/src/main/res -o apk_scratch/compiled_res/res.zip
          $BUILD_TOOLS_DIR/aapt2 link -I $PLATFORM_JAR --manifest android/app/src/main/AndroidManifest.xml -A android/app/src/main/assets -o apk_scratch/unaligned.apk --java apk_scratch/gen apk_scratch/compiled_res/res.zip --auto-add-overlay
          
          # Create Java MainActivity with asset interception
          mkdir -p apk_scratch/src/com/example/myraa
          cat << 'EOF' > apk_scratch/src/com/example/myraa/MainActivity.java
          package com.example.myraa;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.content.res.AssetManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;
          import android.view.WindowManager;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;

              static class CustomChromeClient extends WebChromeClient {
                  @Override
                  public void onPermissionRequest(final PermissionRequest request) {
                      if (request != null) {
                          request.grant(request.getResources());
                      }
                  }
              }

              static class CustomViewClient extends WebViewClient {
                  private AssetManager assetManager;

                  public CustomViewClient(AssetManager am) {
                      this.assetManager = am;
                  }

                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      Uri uri = request.getUrl();
                      String path = uri.getPath();
                      if (path == null || path.equals("/") || path.isEmpty()) {
                          path = "index.html";
                      }
                      if (path.startsWith("/")) {
                          path = path.substring(1);
                      }

                      try {
                          InputStream is = assetManager.open(path);
                          String mime = "text/html";
                          if (path.endsWith(".js") || path.endsWith(".mjs")) mime = "application/javascript";
                          else if (path.endsWith(".css")) mime = "text/css";
                          else if (path.endsWith(".png")) mime = "image/png";
                          else if (path.endsWith(".jpg") || path.endsWith(".jpeg")) mime = "image/jpeg";
                          else if (path.endsWith(".svg")) mime = "image/svg+xml";
                          else if (path.endsWith(".ico")) mime = "image/x-icon";
                          else if (path.endsWith(".json")) mime = "application/json";
                          else if (path.endsWith(".vrm") || path.endsWith(".glb")) mime = "model/gltf-binary";
                          else if (path.endsWith(".woff2")) mime = "font/woff2";
                          else if (path.endsWith(".woff")) mime = "font/woff";
                          else if (path.endsWith(".ttf")) mime = "font/ttf";

                          Map<String, String> responseHeaders = new HashMap<>();
                          responseHeaders.put("Access-Control-Allow-Origin", "*");
                          responseHeaders.put("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
                          responseHeaders.put("Access-Control-Allow-Headers", "*");
                          return new WebResourceResponse(mime, "UTF-8", 200, "OK", responseHeaders, is);
                      } catch (Exception e) {
                          return super.shouldInterceptRequest(view, request);
                      }
                  }

                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                      return false;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  String[] permissions = new String[]{
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.MODIFY_AUDIO_SETTINGS
                  };
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(permissions, 101);
                      }
                  }

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  webView.setWebChromeClient(new CustomChromeClient());
                  webView.setWebViewClient(new CustomViewClient(getAssets()));

                  setContentView(webView);
                  webView.loadUrl("https://myraa.local/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          javac --release 8 -cp $PLATFORM_JAR -d apk_scratch/classes apk_scratch/gen/com/example/myraa/R.java apk_scratch/src/com/example/myraa/MainActivity.java
          java -cp $BUILD_TOOLS_DIR/lib/d8.jar com.android.tools.r8.D8 --lib $PLATFORM_JAR --output apk_scratch/dex $(find apk_scratch/classes -name "*.class")
          
          jar -uf apk_scratch/unaligned.apk -C apk_scratch/dex classes.dex
          $BUILD_TOOLS_DIR/zipalign -v -p 4 apk_scratch/unaligned.apk apk_scratch/aligned.apk
          
          keytool -genkey -v -keystore apk_scratch/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          java -jar $BUILD_TOOLS_DIR/lib/apksigner.jar sign --ks apk_scratch/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out android_dist/MYRAA.apk apk_scratch/aligned.apk
          echo "✅ Successfully built standalone MYRAA.apk!"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android_dist/MYRAA.apk
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: release_files

      - name: Generate Consolidated Checksums
        run: |
          cd release_files
          sha256sum MYRAA-* MYRAA.apk 2>/dev/null > SHA256SUMS.txt || sha256sum * 2>/dev/null > SHA256SUMS.txt || true
          cp SHA256SUMS.txt checksums.sha256 2>/dev/null || true
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "MYRAA v1.0.0 — Universal Desktop Companion & PC Control Engine by Aarav"
          draft: false
          prerelease: false
          files: |
            release_files/MYRAA-Setup-*.exe
            release_files/MYRAA-Portable-*.exe
            release_files/MYRAA-*-Windows-Universal-Portable.zip
            release_files/MYRAA.apk
            release_files/SHA256SUMS.txt
            release_files/checksums.sha256
          body: |
            # 🌸 MYRAA v1.0.0 — Universal Desktop Companion & PC Control Engine
            **Created & Designed by Aarav**

            ### 📥 Direct Distribution Downloads:
            - **`MYRAA-Setup-1.0.0.exe`**: Full Windows NSIS installer with desktop shortcut & uninstaller.
            - **`MYRAA-Portable-1.0.0.exe`**: Single-file standalone zero-install executable.
            - **`MYRAA-v1.0.0-Windows-Universal-Portable.zip`**: Universal portable distribution folder archive.
            - **`MYRAA.apk`**: Standalone Android mobile companion application with local asset interception & voice interaction.
            - **`SHA256SUMS.txt`**: Cryptographic SHA256 verification checksums for all release binaries.

            ---
            *Built automatically via GitHub Actions CI/CD Pipeline.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
