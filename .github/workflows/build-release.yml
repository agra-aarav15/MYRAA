name: Build and Release MYRAA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use the package.json version.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Distribution Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Version from package.json
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Native C# Clicker and Launcher
        shell: pwsh
        run: |
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" -Force }
          if (-not (Test-Path "icon.ico")) { throw "Missing required icon.ico in repository root!" }
          Copy-Item "icon.ico" -Destination "build/icon.ico" -Force
          if (Test-Path "icon.png") { Copy-Item "icon.png" -Destination "build/icon.png" -Force }
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "Required C# compiler csc.exe not found at $csc!" }
          if (-not (Test-Path "electron\clicker.cs")) { throw "Missing required source file electron\clicker.cs!" }
          & $csc /target:exe /out:build\clicker.exe /optimize+ /platform:anycpu /r:System.Drawing.dll,System.Windows.Forms.dll,System.Management.dll electron\clicker.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile clicker.exe!" }
          if (Test-Path "electron\launcher.cs") {
            & $csc /target:winexe /out:build\MYRAA-launcher.exe /win32icon:build\icon.ico electron\launcher.cs
            if ($LASTEXITCODE -ne 0) { throw "Failed to compile MYRAA-launcher.exe!" }
          }
          # Ship the freshly compiled engine, not the stale tracked copy
          if (Test-Path "resources\agent") {
            Copy-Item "build\clicker.exe" -Destination "resources\agent\clicker.exe" -Force
            Write-Host "Synced freshly compiled clicker.exe into resources/agent for packaging."
          } else { throw "Missing resources\agent folder — installers would ship without the desktop engine!" }

      - name: Package with Electron Builder (NSIS & Portable)
        shell: pwsh
        run: |
          npx --yes electron-builder --win --x64 -p never --config.directories.output=release_dist
          if (-not (Test-Path "release_dist\win-unpacked\resources\agent\clicker.exe")) { throw "Packaged app is missing resources\agent\clicker.exe — extraResources failed!" }

      - name: Package Universal Standalone ZIP
        shell: pwsh
        run: |
          if (Test-Path "release_dist\win-unpacked") {
            Write-Host "Creating Universal Standalone Portable ZIP from win-unpacked..."
            Compress-Archive -Path release_dist\win-unpacked\* -DestinationPath "release_dist\MYRAA-v${env:VERSION}-Windows-Universal-Portable.zip" -CompressionLevel Optimal -Force
          } else {
            Write-Host "Creating Universal Standalone Portable ZIP from repository root..."
            if (-not (Test-Path "release_dist")) { New-Item -ItemType Directory -Path "release_dist" -Force }
            Compress-Archive -Path dist, electron, assets, START_SERVER.bat, package.json, icon.ico, icon.png, README.md, LICENSE -DestinationPath "release_dist\MYRAA-v${env:VERSION}-Windows-Universal-Portable.zip" -CompressionLevel Optimal -Force
          }

      - name: Standardize Windows Output Filenames
        shell: pwsh
        run: |
          Get-ChildItem release_dist
          $setup = Get-ChildItem release_dist -Filter "*Setup*.exe" | Select-Object -First 1
          if ($setup -and ($setup.Name -ne "MYRAA-Setup-${env:VERSION}.exe")) {
            Copy-Item $setup.FullName -Destination "release_dist/MYRAA-Setup-${env:VERSION}.exe" -Force
          }
          $portable = Get-ChildItem release_dist -Filter "*Portable*.exe" | Select-Object -First 1
          if ($portable -and ($portable.Name -ne "MYRAA-Portable-${env:VERSION}.exe")) {
            Copy-Item $portable.FullName -Destination "release_dist/MYRAA-Portable-${env:VERSION}.exe" -Force
          }
          if (-not (Get-ChildItem release_dist -Filter "*Setup*.exe")) { throw "No Setup EXE produced!" }
          if (-not (Get-ChildItem release_dist -Filter "*Portable*.exe")) { throw "No Portable EXE produced!" }

      - name: Generate Windows SHA256 Checksums
        shell: pwsh
        run: |
          Get-FileHash release_dist\MYRAA-* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -FilePath release_dist\SHA256SUMS-windows.txt -Encoding ascii
          Get-Content release_dist\SHA256SUMS-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release_dist/MYRAA-Setup-*.exe
            release_dist/MYRAA-Portable-*.exe
            release_dist/MYRAA-*-Windows-Universal-Portable.zip
            release_dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          if [ -f icon.png ]; then cp icon.png android/app/src/main/assets/icon.png; fi
          if [ -f icon.ico ]; then cp icon.ico android/app/src/main/assets/favicon.ico; fi
          rm -f android/app/src/main/assets/agent/clicker.exe android/app/src/main/assets/clicker.exe
          if [ ! -f android/app/src/main/assets/index.html ]; then echo "FATAL: dist web bundle missing index.html"; exit 1; fi

      - name: Compile Standalone Android APK
        run: |
          mkdir -p android_dist
          echo "Compiling standalone APK via Android SDK build-tools..."
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          PLATFORM_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Using Build Tools: $BUILD_TOOLS_DIR, Platform: $PLATFORM_JAR"

          mkdir -p apk_scratch/compiled_res apk_scratch/gen apk_scratch/classes apk_scratch/dex
          $BUILD_TOOLS_DIR/aapt2 compile --dir android/app/src/main/res -o apk_scratch/compiled_res/res.zip
          $BUILD_TOOLS_DIR/aapt2 link -I $PLATFORM_JAR --manifest android/app/src/main/AndroidManifest.xml -A android/app/src/main/assets -o apk_scratch/unaligned.apk --java apk_scratch/gen apk_scratch/compiled_res/res.zip --auto-add-overlay

          javac --release 8 -cp $PLATFORM_JAR -d apk_scratch/classes apk_scratch/gen/com/example/myraa/R.java android/app/src/main/java/com/example/myraa/MainActivity.java
          java -cp $BUILD_TOOLS_DIR/lib/d8.jar com.android.tools.r8.D8 --lib $PLATFORM_JAR --output apk_scratch/dex $(find apk_scratch/classes -name "*.class")

          jar -uf apk_scratch/unaligned.apk -C apk_scratch/dex classes.dex
          $BUILD_TOOLS_DIR/zipalign -v -p 4 apk_scratch/unaligned.apk apk_scratch/aligned.apk
          echo "✅ APK assembled (unsigned) — next step signs it."

      - name: Sign APK (persistent release keystore)
        env:
          MYRAA_KEYSTORE_BASE64: ${{ secrets.MYRAA_KEYSTORE_BASE64 }}
          MYRAA_KEYSTORE_PASS: ${{ secrets.MYRAA_KEYSTORE_PASS }}
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [ -n "$MYRAA_KEYSTORE_BASE64" ] && [ -n "$MYRAA_KEYSTORE_PASS" ]; then
            echo "$MYRAA_KEYSTORE_BASE64" | base64 -d > apk_scratch/release.keystore
            KS_FILE=apk_scratch/release.keystore
            KS_ALIAS=myraa
            KS_PASS="pass:$MYRAA_KEYSTORE_PASS"
            KEY_PASS="pass:$MYRAA_KEYSTORE_PASS"
            echo "Signing with the persistent MYRAA release keystore (updates will install over previous versions)."
          else
            echo "WARNING: MYRAA_KEYSTORE_BASE64 / MYRAA_KEYSTORE_PASS secrets are not configured!"
            echo "Falling back to an EPHEMERAL keystore — this APK will NOT install over a previously released one."
            keytool -genkeypair -v -keystore apk_scratch/ephemeral.keystore -alias myraa -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MYRAA, O=Aarav, C=IN"
            KS_FILE=apk_scratch/ephemeral.keystore
            KS_ALIAS=myraa
            KS_PASS=pass:android
            KEY_PASS=pass:android
          fi
          java -jar "$BUILD_TOOLS_DIR/lib/apksigner.jar" sign --ks "$KS_FILE" --ks-pass "$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "$KEY_PASS" --out android_dist/MYRAA.apk apk_scratch/aligned.apk
          echo "✅ Successfully built standalone MYRAA.apk!"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android_dist/MYRAA.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (for version)
        uses: actions/checkout@v4

      - name: Read Version from package.json
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: release_files

      - name: Generate Consolidated Checksums
        run: |
          cd release_files
          sha256sum MYRAA-* MYRAA.apk > SHA256SUMS.txt
          cp SHA256SUMS.txt checksums.sha256
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', env.VERSION) }}
          name: "MYRAA v${{ env.VERSION }} — Universal Desktop Companion & PC Control Engine by Aarav"
          draft: false
          prerelease: false
          files: |
            release_files/MYRAA-Setup-*.exe
            release_files/MYRAA-Portable-*.exe
            release_files/MYRAA-*-Windows-Universal-Portable.zip
            release_files/MYRAA.apk
            release_files/SHA256SUMS.txt
            release_files/checksums.sha256
          body: |
            # 🌸 MYRAA v${{ env.VERSION }} — Universal Desktop Companion & PC Control Engine
            **Created & Designed by Aarav**

            ### 📥 Direct Distribution Downloads:
            - **`MYRAA-Setup-${{ env.VERSION }}.exe`**: Full Windows NSIS installer with desktop shortcut & uninstaller.
            - **`MYRAA-Portable-${{ env.VERSION }}.exe`**: Single-file standalone zero-install executable.
            - **`MYRAA-v${{ env.VERSION }}-Windows-Universal-Portable.zip`**: Universal portable distribution folder archive (includes the native clicker engine).
            - **`MYRAA.apk`**: Standalone Android mobile companion application with internal server engine & full phone controls.
            - **`SHA256SUMS.txt`**: Cryptographic SHA256 verification checksums for all release binaries.

            ---
            *Built automatically via GitHub Actions CI/CD Pipeline.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
